<div class="landlord-shell">
  <aside class="landlord-sidebar" aria-label="Landlord navigation">
    <a class="landlord-brand" routerLink="/landlord/dashboard" aria-label="TrustRent dashboard">
      <span class="brand-symbol material-symbols-outlined" aria-hidden="true">shield</span>
      <span class="brand-copy"><strong>TrustRent</strong><small>LANDLORD PORTAL</small></span>
    </a>
    <div class="sidebar-label">OPERATIONS</div>
    <nav class="landlord-nav">
      <a routerLink="/landlord/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span>Dashboard</a>
      <a routerLink="/landlord/properties" routerLinkActive="active"><span class="material-symbols-outlined" aria-hidden="true">real_estate_agent</span>My Properties</a>
      <a class="nav-add" routerLink="/landlord/properties/new" routerLinkActive="active"><span class="material-symbols-outlined" aria-hidden="true">add_circle</span>Add Property</a>
    </nav>
    <div class="sidebar-footer">PROPERTY MANAGEMENT</div>
  </aside>

  <div class="landlord-main">
    <header class="landlord-topbar">
      <span class="topbar-title">Landlord Workspace</span>
      <div class="topbar-actions">
        @if (user(); as currentUser) { <span class="topbar-user">{{ currentUser.fullName }}</span> }
        <a class="topbar-action" routerLink="/landlord/properties/new"><span class="material-symbols-outlined" aria-hidden="true">add</span>Add Property</a>
        <button class="sign-out" type="button" (click)="signOut()" aria-label="Sign out"><span class="material-symbols-outlined" aria-hidden="true">logout</span><span>Sign out</span></button>
      </div>
    </header>
    <main class="route-content"><router-outlet /></main>
  </div>

  @if (successMessage()) {
    <div class="toast-success" role="status">
      <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
      <span>{{ successMessage() }}</span>
      <button type="button" aria-label="Dismiss notification" (click)="dismissSuccess()"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>
  }
</div>
