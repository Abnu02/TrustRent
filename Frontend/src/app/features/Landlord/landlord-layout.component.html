<div class="landlord-shell">
  <aside class="landlord-sidebar" aria-label="Landlord navigation">
    <a class="landlord-brand" routerLink="/landlord/dashboard" aria-label="TrustRent dashboard">
      <span class="brand-symbol"><app-landlord-icon name="shield-check" /></span>
      <span class="brand-copy"><strong>TrustRent</strong><small>LANDLORD PORTAL</small></span>
    </a>
    <div class="sidebar-label">OPERATIONS</div>
    <nav class="landlord-nav">
      <a routerLink="/landlord/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><app-landlord-icon name="dashboard" />Dashboard</a>
      <a routerLink="/landlord/properties" routerLinkActive="active"><app-landlord-icon name="buildings" />My Properties</a>
      <a class="nav-add" routerLink="/landlord/properties/new" routerLinkActive="active"><app-landlord-icon name="plus-circle" />Add Property</a>
    </nav>
    <div class="sidebar-footer">PROPERTY MANAGEMENT</div>
  </aside>

  <div class="landlord-main">
    <header class="landlord-topbar">
      <span class="topbar-title">Landlord Workspace</span>
      <div class="topbar-actions">
        @if (user(); as currentUser) { <span class="topbar-user">{{ currentUser.fullName }}</span> }
        <a class="topbar-action" routerLink="/landlord/properties/new"><app-landlord-icon name="plus" />Add Property</a>
        <button class="sign-out" type="button" (click)="signOut()" aria-label="Sign out"><app-landlord-icon name="log-out" /><span>Sign out</span></button>
      </div>
    </header>
    <main class="route-content"><router-outlet /></main>
  </div>

  @if (successMessage()) {
    <div class="toast-success" role="status">
      <app-landlord-icon name="check-circle" />
      <span>{{ successMessage() }}</span>
      <button type="button" aria-label="Dismiss notification" (click)="dismissSuccess()"><app-landlord-icon name="close" /></button>
    </div>
  }
</div>
