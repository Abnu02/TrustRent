<header class="navbar">

  <div class="brand">

    <div class="logo">
      ✓
    </div>

    <div class="brand-text">
      <strong>TrustRent</strong>
      <span>Tenant Dashboard</span>
    </div>

  </div>


  <div class="profile-area">

    <button
      type="button"
      class="profile-button"
      (click)="toggleMenu()">

      <span class="status-dot"></span>

      <span class="verified-text">
        Verified Tenant
      </span>

      <span class="avatar">
        {{ user.fullName.charAt(0) }}
      </span>

    </button>


    @if (menuOpen()) {

      <div class="profile-menu">

        <div class="profile-header">

          <div class="large-avatar">
            {{ user.fullName.charAt(0) }}
          </div>

          <div>
            <strong>
              {{ user.fullName }}
            </strong>

            <span>
              {{ user.email }}
            </span>
          </div>

        </div>


        <div class="profile-info">

          <div>
            <span>Role</span>
            <strong>{{ user.role }}</strong>
          </div>

          <div>
            <span>Verification</span>
            <strong class="verified">
              ✓ Verified
            </strong>
          </div>

        </div>


        <button
          type="button"
          class="logout-button"
          (click)="logout()">

          <span>↪</span>
          Logout

        </button>

      </div>

    }

  </div>

</header>
