services:
  - type: web
    name: trustrent-api
    runtime: docker
    plan: free
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: TrustRent.Api
      - key: Jwt__Audience
        value: TrustRent.Client
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__Folder
        value: trustrent/properties
